# DataHub Ingestion Recipe - PostgreSQL to DataHub
# Ingests metadata from HydroLineage PostgreSQL database

source:
  type: postgres
  config:
    # Database connection - warehouse Postgres service deployed by the Airflow Helm chart
    host_port: "airflow-lineage-warehouse-postgresql.hydro-lineage.svc.cluster.local:5432"
    # Database name used in dataset URNs (aligns with dbt dataset names)
    database: "hydro"
    username: "postgres"
    password: "${POSTGRES_PASSWORD}"  # From K8s secret, available as env var
    
    # platform_instance: "hydro"  # Aligns with dbt platform instance for consistent URNs
    # Platform instance intentionally omitted to avoid double-prefix in URNs

    # Schemas to ingest
    schema_pattern:
      allow:
        - "raw"
        - "analytics_staging"
        - "analytics_analytics"
      deny:
        - "pg_catalog"
        - "information_schema"
    
    # Tables to include (optional - comment out to include all)
    # table_pattern:
    #   allow:
    #     - "raw.stations"
    #     - "raw.water_level_readings"
    #     - "analytics_analytics.dim_station"
    #     - "analytics_analytics.fct_water_levels"
    
    # Enable profiling for data statistics (warehouse profiling)
    profiling:
      enabled: true
      profile_table_level_only: false  # Include column-level statistics
      turn_off_expensive_profiling_metrics: false  # Enable all metrics for warehouse
      profile_if_updated_since_days: 1  # Profile if updated in last 24 hours
      max_number_of_fields_to_profile: 100  # Increase field limit
      
      # Row count and size metrics
      include_field_null_count: true
      include_field_distinct_count: true
      
      # Statistical metrics for numeric columns
      include_field_min_value: true
      include_field_max_value: true
      include_field_mean_value: true
      include_field_median_value: true
      include_field_stddev_value: true
      include_field_quantiles: true  # Include quartile information
      
      # Distribution metrics
      include_field_distinct_value_frequencies: true
      include_field_histogram: true
      include_field_sample_values: true
      
      # Query-based profiling for better performance on large tables
      query_combiner_enabled: true
    
    # Stateful ingestion requires additional config (and differs by DataHub CLI version).
    # Keep it disabled for this demo deployment to avoid config-version mismatches.
    stateful_ingestion:
      enabled: false

# DataHub connection - uses env var set by DAG task
sink:
  type: "datahub-rest"
  config:
    server: "${DATAHUB_GMS_URL}"  # Set via environment variable in Airflow task
    token: "${DATAHUB_GMS_TOKEN}"
    disable_ssl_verification: true
# Transformers for enriching metadata
transformers:
  - type: "simple_add_dataset_tags"
    config:
      tag_urns:
        - "urn:li:tag:HydroLineage"
        - "urn:li:tag:FloodMonitoring"
  
  - type: "pattern_add_dataset_tags"
    config:
      tag_pattern:
        rules:
          "raw.*": ["urn:li:tag:RawData"]
          "analytics_staging.*": ["urn:li:tag:Staging"]
          "analytics_analytics.*": ["urn:li:tag:Analytics"]
