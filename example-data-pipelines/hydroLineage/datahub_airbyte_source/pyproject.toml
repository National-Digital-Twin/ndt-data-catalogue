[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datahub-airbyte-source"
version = "0.1.0"
description = "Custom DataHub Airbyte ingestion source"
requires-python = ">=3.10"
dependencies = ["requests"]

[project.entry-points."datahub.ingestion.source.plugins"]
airbyte = "datahub_airbyte_source.airbyte_source:AirbyteSource"
