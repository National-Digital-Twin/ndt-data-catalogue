# dbt Profile for Kubernetes Deployment
# Used by Airflow pods in hydro-lineage namespace
# Do not modify - this file is copied during setup-dags.sh

hydro_lineage:
  target: dev
  
  outputs:
    dev:
      type: postgres
      host: airflow-lineage-warehouse-postgresql  # K8s service name
      port: 5432
      user: postgres
      password: "{{ env_var('DBT_PASSWORD') }}"  # From hydro-db-credentials secret/env
      dbname: hydro
      schema: analytics
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
      search_path: "analytics,raw,public"
