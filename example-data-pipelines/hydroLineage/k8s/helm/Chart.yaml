apiVersion: v2
name: airflow-lineage
description: HydroLineage Data Platform - Airflow, PostgreSQL, and dbt
type: application
version: 1.0.0
appVersion: "1.0"

dependencies:
  # Apache Airflow (includes PostgreSQL for metadata)
  - name: airflow
    # 1.17.0 is the latest chart release that supports Airflow 3.16.x
    version: ~1.17.0
    repository: https://airflow.apache.org
    condition: airflow.enabled

  # Warehouse PostgreSQL (separate from Airflow metadata)
  - name: postgresql
    version: ~13.2.0
    repository: https://charts.bitnami.com/bitnami
    condition: warehouse-postgresql.enabled
    alias: warehouse-postgresql

  # NOTE: Airbyte cannot be added as a dependency due to Helm chart conflicts
  # (both Airflow and Airbyte depend on Bitnami's 'common' chart)
  # Install Airbyte separately: see k8s/README.md for instructions
