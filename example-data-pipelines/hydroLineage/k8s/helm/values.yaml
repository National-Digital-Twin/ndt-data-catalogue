              fi
            done
        volumeMounts:
          - name: dags-configmap
            mountPath: /configmap
          - name: dags
            mountPath: /opt/airflow/dags
  
  # Scheduler configuration
  scheduler:
    replicas: 1
    
    # Configure hostname for log server access via headless service
    # This allows webserver to fetch logs from scheduler pods
    env:
      - name: AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT
        value: "8793"
    
    # Lifecycle hooks to create DataHub connection on startup
    extraContainers: []
    command:
      - bash
      - -c
      - |
        # Ensure AIRFLOW_CONN_DATAHUB_REST is set (prefer existing env/secret value)
        export DATAHUB_GMS_URL="${DATAHUB_GMS_URL:-http://datahub-datahub-gms.datahub.svc.cluster.local:8080}"
        if [ -z "$AIRFLOW_CONN_DATAHUB_REST" ] && [ -n "$DATAHUB_GMS_TOKEN" ]; then
          export AIRFLOW_CONN_DATAHUB_REST="http://:${DATAHUB_GMS_TOKEN}@${DATAHUB_GMS_URL#http://}"
        fi
        # Run normal Airflow scheduler command
        exec airflow scheduler
    
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
