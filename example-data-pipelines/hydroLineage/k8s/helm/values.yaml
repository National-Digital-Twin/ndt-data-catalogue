  # Worker configuration
  # CeleryExecutor requires worker pods. If replicas is 0, tasks will sit in "queued".
  workers:
    replicas: 1
    resources:
      limits:
        cpu: 1000m
        memory: 4Gi  # Increased from 3Gi - Airflow 3 workers need more memory
      requests:
        cpu: 100m
        memory: 1Gi  # Increased from 512Mi to better reflect actual usage
