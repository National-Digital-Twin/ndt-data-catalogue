            /opt/airflow/dbt_venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
              dbt-core==1.11.2 \
              dbt-postgres==1.10.0

            # Install DataHub CLI for metadata ingestion (includes dbt plugin)
            /opt/airflow/dbt_venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
              'acryl-datahub[dbt,postgres,airbyte]'


            mkdir -p /opt/airflow/extra_python_packages
            python -m pip install --disable-pip-version-check --no-cache-dir \
              --target /opt/airflow/extra_python_packages \
              apache-airflow-providers-standard>=1.0.0 \
              apache-airflow-providers-airbyte==3.8.1 \
              acryl-datahub-airflow-plugin[airflow3]
        volumeMounts:
          - name: dbt
            mountPath: /opt/airflow/dbt
          - name: dbt-venv
            mountPath: /opt/airflow/dbt_venv
          - name: extra-python-packages
            mountPath: /opt/airflow/extra_python_packages
      - name: copy-dags
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /opt/airflow/dags/utils
            for file in /configmap/*; do
              filename=$(basename "$file")
              if echo "$filename" | grep -q "^utils_"; then
                cp "$file" "/opt/airflow/dags/utils/$(echo $filename | sed 's/^utils_//')"
              else
                cp "$file" "/opt/airflow/dags/$filename"
              fi
            done
        volumeMounts:
          - name: dags-configmap
            mountPath: /configmap
          - name: dags
            mountPath: /opt/airflow/dags
      - name: copy-datahub-recipes
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /opt/airflow/datahub/recipes
            if [ -d /configmap-datahub ]; then
              cp /configmap-datahub/* /opt/airflow/datahub/recipes/ 2>/dev/null || echo "No DataHub recipes found"
              echo "✅ DataHub recipes copied"
            else
              echo "⚠️  DataHub recipes ConfigMap not found"
            fi
        volumeMounts:
          - name: datahub-recipes-configmap
            mountPath: /configmap-datahub
            readOnly: true
          - name: datahub
            mountPath: /opt/airflow/datahub

  # Triggerer configuration (needed for deferrable operators)
  triggerer:
    enabled: true
    extraVolumes:
      - name: dags-configmap
        configMap:
          name: airflow-lineage-dags
      - name: dbt-configmap
        configMap:
          name: airflow-lineage-dbt
      - name: dags
        emptyDir: {}
      - name: dbt
        emptyDir: {}
      - name: dbt-venv
        emptyDir: {}
      - name: extra-python-packages
        emptyDir: {}
    extraVolumeMounts:
      - name: dags
        mountPath: /opt/airflow/dags
      - name: dbt
        mountPath: /opt/airflow/dbt
      - name: dbt-venv
        mountPath: /opt/airflow/dbt_venv
      - name: extra-python-packages
        mountPath: /opt/airflow/extra_python_packages
    extraInitContainers:
      - name: install-packages
        image: apache/airflow:3.1.6-python3.11
        securityContext:
          runAsUser: 50000
          runAsGroup: 0
          runAsNonRoot: true
        command:
          - bash
          - -c
          - |
            export PIP_USER=0
            unset PIP_USER

            python -m venv /opt/airflow/dbt_venv
            /opt/airflow/dbt_venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -U pip setuptools wheel
            /opt/airflow/dbt_venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
              dbt-core==1.11.2 \
              dbt-postgres==1.10.0

            # Install DataHub CLI for metadata ingestion (includes dbt plugin)
            /opt/airflow/dbt_venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
              'acryl-datahub[dbt,postgres,airbyte]'


            mkdir -p /opt/airflow/extra_python_packages
            python -m pip install --disable-pip-version-check --no-cache-dir \
              --target /opt/airflow/extra_python_packages \
              apache-airflow-providers-standard>=1.0.0 \
              apache-airflow-providers-airbyte==3.8.1 \
              acryl-datahub-airflow-plugin[airflow3]
        volumeMounts:
          - name: dbt
            mountPath: /opt/airflow/dbt
          - name: dbt-venv
            mountPath: /opt/airflow/dbt_venv
          - name: extra-python-packages
            mountPath: /opt/airflow/extra_python_packages
      - name: copy-dags
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /opt/airflow/dags/utils
            for file in /configmap/*; do
              filename=$(basename "$file")
              if echo "$filename" | grep -q "^utils_"; then
                cp "$file" "/opt/airflow/dags/utils/$(echo $filename | sed 's/^utils_//')"
              else
                cp "$file" "/opt/airflow/dags/$filename"
              fi
            done
        volumeMounts:
          - name: dags-configmap
            mountPath: /configmap
          - name: dags
            mountPath: /opt/airflow/dags
  
  # Redis for Celery (disabled for LocalExecutor)
  redis:
    enabled: true
    persistence:
      enabled: false
      size: 1Gi
    podAnnotations:
      # Prevent Karpenter from evicting Redis (required for CeleryExecutor)
      karpenter.sh/do-not-disrupt: "true"
      # Also prevent other autoscalers from evicting
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  
  # PostgreSQL for Airflow metadata (built-in from Airflow chart)
  postgresql:
    enabled: true
    image:
      registry: docker.io
      repository: bitnami/postgresql
      tag: "latest"
    auth:
      enablePostgresUser: true
      postgresPassword: "airflow_secure_password_2024"
      username: airflow
      password: "airflow_secure_password_2024"
      database: airflow
    primary:
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      persistence:
        enabled: true
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi
  
  # Database connection (using separate Airflow PostgreSQL)
  data:
    metadataConnection:
      user: airflow
      pass: "airflow_secure_password_2024"  # Match postgresql password
      host: "airflow-lineage-postgresql"
      port: 5432
      db: airflow
  
  # Additional environment variables
  env:
    - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
      value: "true"
    - name: AIRFLOW__CORE__LOAD_EXAMPLES
      value: "false"
    # DataHub Lineage Plugin Configuration
    - name: AIRFLOW__DATAHUB__ENABLED
      value: "true"
    - name: AIRFLOW__DATAHUB__EMIT_LINEAGE
      value: "true"
    - name: AIRFLOW__DATAHUB__CLUSTER
      value: "prod"
    - name: AIRFLOW__DATAHUB__CAPTURE_OWNERSHIP_INFO
      value: "true"
    - name: AIRFLOW__DATAHUB__CAPTURE_TAGS_INFO
      value: "true"
    # Airflow 3: workers use the execution API for task execution/heartbeats.
    # Use the non-trailing-slash form; the api-server serves `/execution` but may 404 on `/execution/`.
    - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
      value: "http://airflow-lineage-api-server:8080/execution"
    # Define connections via env vars so DAGs can run without manual Airflow UI setup.
    - name: AIRFLOW_CONN_HYDRO_POSTGRES
      value: "postgresql://postgres:CHANGE_ME_SET_VIA_DEPLOY_SH@airflow-lineage-warehouse-postgresql:5432/hydro"
    - name: AIRFLOW_CONN_AIRBYTE_DEFAULT
      value: "http://airbyte-airbyte-server-svc:8001"
    - name: AIRFLOW__DATAHUB__CONN_ID
      value: "datahub_rest"
    - name: DATAHUB_GMS_URL
      value: "http://datahub-datahub-gms.datahub.svc.cluster.local:8080"
    - name: POSTGRES_HOST
      value: "airflow-lineage-warehouse-postgresql"
    - name: POSTGRES_PORT
      value: "5432"
    - name: POSTGRES_DB
      value: "hydro"
    - name: POSTGRES_PASSWORD
      value: "CHANGE_ME_SET_VIA_DEPLOY_SH"
    - name: DBT_USER
      value: "postgres"
    - name: DBT_PASSWORD
      value: "CHANGE_ME_SET_VIA_DEPLOY_SH"
    # Keep base image Airflow install as primary; add dbt venv bin for convenience.
    - name: PATH
      value: "/home/airflow/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/airflow/dbt_venv/bin"
    - name: PYTHONPATH
      value: "/opt/airflow/extra_python_packages"

  # Load additional env vars from Kubernetes Secrets/ConfigMaps.
  # NOTE: Airflow chart schema requires env entries to be {name,value} only;
  # use extraEnvFrom for secretKeyRef/configMapRef.
  extraEnvFrom: |
    - secretRef:
        name: datahub-gms-token
    - secretRef:
        name: airflow-connections
  
  # DAGs configuration - using ConfigMap for automatic deployment
  dags:
    persistence:
      enabled: false  # Using ConfigMap + init containers instead of PVC
    gitSync:
      enabled: false
  
  # Admin user
  webserverSecretKeySecretName: airflow-webserver-secret
  
  # Migration and user creation jobs
  # NOTE: Disabling migrations tends to leave scheduler/worker waiting forever; keep enabled.
  migrateDatabaseJob:
    enabled: true
  createUserJob:
    useHelmHooks: true  # Use Helm hooks for proper migration sequencing
    applyCustomEnv: true
  
  # Airflow configuration
  config:
    core:
      execution_api_server_url: "http://airflow-lineage-api-server:8080/execution"
    celery:
      # Result backend is required for Airflow 3 + CeleryExecutor to store task results
      result_backend: "db+postgresql://airflow:CHANGE_ME_AIRFLOW_DB_PASSWORD@airflow-lineage-postgresql:5432/airflow"
      # Increase timeout for broker/result backend operations to reduce transient queue timeout failures.
      operation_timeout: "30"
    webserver:
      expose_config: "True"
    api:
      auth_backends: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      # secret_key moved here in Airflow 3
      enable_experimental_api: "False"
    lineage:
      # Configure DataHub as the lineage backend
        enabled: true
    datahub:
      # DataHub lineage backend configuration
      # See: https://github.com/datahub-project/datahub/tree/master/metadata-ingestion-modules/airflow-plugin
      enabled: true
      conn_id: datahub_rest  # Uses AIRFLOW_CONN_DATAHUB_REST env var
      # Cluster/environment identifier (shows in URNs)
      cluster: dev  # Shorter than 'prod', can also use 'local', 'k8s', etc.
      # Enable DataHub's enhanced SQL parser for column-level lineage
      patch_sql_parser: true
      # Enable all extractors for comprehensive lineage
      enable_extractors: true
      # Capture lineage for all supported operators
      capture_ownership_info: true
      capture_tags_info: true
      # Emit task lineage (shows connections between tasks)
      emit_lineage: true
    logging:
      # Enable proper log fetching in Kubernetes with headless service
      # Format: <pod-name>.<service-name>.<namespace>.svc.cluster.local
      worker_log_server_port: "8793"
      # With workers.persistence.enabled: true, scheduler runs as StatefulSet
      # which enables DNS-based log fetching from individual scheduler pods

# =============================================================================
# Airbyte (Optional Data Integration)
# =============================================================================
# NOTE: Airbyte must be installed as a SEPARATE Helm release (not as a dependency)
# Reason: Both Airflow and Airbyte charts depend on Bitnami's 'common' library,
#         causing template conflicts when installed together.
#
# To install Airbyte separately:
#   helm repo add airbyte https://airbytehq.github.io/helm-charts
#   helm install airbyte airbyte/airbyte -n hydro-lineage --set global.edition=community
#
# See k8s/README.md for full instructions.

# =============================================================================
# Global Configuration
# =============================================================================
global:
  namespace: hydro-lineage
