# HydroLineage - Helm Values (Simple K8s Deployment)
# Deploy Airflow and dependencies to Kubernetes cluster

# =============================================================================
# PostgreSQL - Data Warehouse
# =============================================================================
warehouse-postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: "latest"
  auth:
    database: hydro
    username: postgres
    password: "CHANGE_ME_SET_VIA_DEPLOY_SH"  # Runtime secret created by k8s/deploy.sh
    postgresPassword: "CHANGE_ME_SET_VIA_DEPLOY_SH"  # Must match password
  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "ebs-gp3-default"  # Explicitly set storage class
    podAnnotations:
      # Prevent Karpenter node consolidation from disrupting this database
      karpenter.sh/do-not-disrupt: "true"
      # Also prevent pod descheduler eviction
      descheduler.alpha.kubernetes.io/evict: "false"
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    podSecurityContext:
      enabled: true
      fsGroup: 1001
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true
    resources:
      limits:
        cpu: 500m
      requests:
        cpu: 250m  # Increased from 100m to avoid underutilization eviction
        memory: 512Mi
    initdb:
      scriptsConfigMap: "{{ .Release.Name }}-hydro-postgres-init"
  service:
    type: ClusterIP
    ports:
      postgresql: 5432

# =============================================================================
# Apache Airflow
# =============================================================================
airflow:
  enabled: true
  
  # Airflow version
  airflowVersion: "3.1.6"
  defaultAirflowRepository: apache/airflow
  defaultAirflowTag: "3.1.6-python3.11"
  
  # Executor
  # Executor
  # LocalExecutor runs tasks on the scheduler pod, which requires shared/RWX log storage
  # for the API server/UI to read task logs. CeleryExecutor avoids that by running tasks
  # on workers which expose a log server the UI can fetch from.
  executor: "CeleryExecutor"
  
  # Logs persistence - enables webserver to read logs from scheduler/worker pods
  # Uses emptyDir for simplicity; in production consider PVC or remote logging
  logs:
    persistence:
      enabled: false  # Use emptyDir volumes for local logging

  
  # Fernet key for encryption (generate new: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
  fernetKey: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho="  # Change in production
  
  # Webserver secret key - NOTE: This is overridden by deploy.sh which creates the secret before Helm
  # The actual secret is created by deploy.sh with a random value
  # DO NOT set a value here - leave empty so Helm doesn't override the pre-created secret
  # webserverSecretKey: ""
  
  # Connections configuration
  connections:
    postgres:
      host: "{{ .Release.Name }}-warehouse-postgresql"
      port: "5432"
      database: "hydro"
      user: "postgres"
      password: "CHANGE_ME_SET_VIA_DEPLOY_SH"
    datahub:
      enabled: true
      host: "datahub-gms"
      port: "8080"

  # dbt configuration
  dbt:
    password: "CHANGE_ME_SET_VIA_DEPLOY_SH"
  
  # Webserver configuration (Helm chart uses this name, but Airflow 3 runs api-server command)
  webserver:
    service:
      type: LoadBalancer  # Change to ClusterIP if using Ingress
      ports:
        - name: airflow-ui
          port: 8080
    replicas: 1
    resources:
      limits:
        cpu: 750m
        memory: 2000Mi
      requests:
        cpu: 100m
        memory: 400Mi
    defaultUser:
      enabled: true
      username: admin
      password: admin
      firstName: Admin
      lastName: User
      email: admin@example.com

    extraVolumes:
      - name: dags-configmap
        configMap:
          name: airflow-lineage-dags
      - name: dbt-configmap
        configMap:
          name: airflow-lineage-dbt
      - name: datahub-recipes-configmap
        configMap:
          name: airflow-lineage-datahub-recipes
      - name: dags
        emptyDir: {}
      - name: dbt
        emptyDir: {}
      - name: datahub
        emptyDir: {}
      - name: dbt-venv
        emptyDir: {}
      - name: extra-python-packages
        emptyDir: {}
    extraVolumeMounts:
      - name: dags
        mountPath: /opt/airflow/dags
      - name: dbt
        mountPath: /opt/airflow/dbt
      - name: datahub
        mountPath: /opt/airflow/datahub
      - name: dbt-venv
        mountPath: /opt/airflow/dbt_venv
      - name: extra-python-packages
        mountPath: /opt/airflow/extra_python_packages
    extraInitContainers:
      - name: copy-dbt
        image: apache/airflow:3.1.6-python3.11
        securityContext:
          runAsUser: 50000
          runAsGroup: 0
          runAsNonRoot: true
        command:
          - bash
          - -c
          - |
            # Copy dbt files from ConfigMap to writable directory with proper structure
            if [ -d /configmap-dbt ]; then
              mkdir -p /opt/airflow/dbt
              cd /configmap-dbt
              for file in *; do
                if [ -f "$file" ]; then
                  # Convert flattened name to directory path (models__staging__file.sql -> models/staging/file.sql)
                  target_path=$(echo "$file" | sed 's/__/\//g')
                  target_dir=$(dirname "$target_path")
                  mkdir -p "/opt/airflow/dbt/$target_dir"
                  cp "$file" "/opt/airflow/dbt/$target_path"
                fi
              done
              echo "✅ dbt project copied from ConfigMap with directory structure"
            else
              echo "⚠️  dbt ConfigMap not found, creating empty directory"
              mkdir -p /opt/airflow/dbt
            fi
            
            echo "✅ Using DataHub Airflow provider for lineage tracking"
        volumeMounts:
          - name: dbt-configmap
            mountPath: /configmap-dbt
            readOnly: true
          - name: dbt
            mountPath: /opt/airflow/dbt
      - name: install-packages
        image: apache/airflow:3.1.6-python3.11
        securityContext:
          runAsUser: 50000
          runAsGroup: 0
          runAsNonRoot: true
        command:
          - bash
          - -c
          - |
            set +e  # Don't exit on errors - we handle them explicitly
            export PIP_USER=0
            unset PIP_USER

            echo "📦 Starting package installation..."

            # Install dbt into a dedicated venv to avoid protobuf conflicts with DataHub dependencies
            python -m venv /opt/airflow/dbt_venv
            /opt/airflow/dbt_venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -U pip setuptools wheel || true
            /opt/airflow/dbt_venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
              dbt-core==1.11.2 \
              dbt-postgres==1.10.0 || true

            # Install DataHub CLI for metadata ingestion (includes dbt plugin)
            echo "📦 Installing DataHub CLI..."
            /opt/airflow/dbt_venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
              'acryl-datahub[dbt,postgres,airbyte]' 2>&1 | grep -v "ERROR: pip's dependency resolver" || true
            echo "✅ DataHub CLI installation complete"

            # Install dbt package dependencies
            echo "📦 Installing dbt packages..."
            echo "🔍 Checking for /opt/airflow/dbt/packages.yml..."
            ls -la /opt/airflow/dbt/*.yml 2>&1 || echo "No yml files found"
            if [ -f /opt/airflow/dbt/packages.yml ]; then
              echo "✅ packages.yml found, running dbt deps..."
              cd /opt/airflow/dbt
              /opt/airflow/dbt_venv/bin/dbt deps --profiles-dir . 2>&1 || echo "⚠️  dbt deps failed, continuing..."
              ls -la dbt_packages/ 2>&1 | head -10 || echo "No dbt_packages directory created"
              echo "✅ dbt deps complete"
              cd /opt/airflow
            else
              echo "❌ packages.yml NOT found, skipping dbt deps"
            fi

            # Install Airflow providers into the user site-packages
            echo "📦 Installing Airflow providers..."
            mkdir -p /opt/airflow/extra_python_packages
            python -m pip install --disable-pip-version-check --no-cache-dir \
              --target /opt/airflow/extra_python_packages \
              apache-airflow-providers-standard>=1.0.0 \
              apache-airflow-providers-airbyte==3.8.1 \
              acryl-datahub-airflow-plugin[airflow3] \
              'SQLAlchemy<2.0' || true
            
            echo "✅ All package installations complete"
        volumeMounts:
          - name: dbt
            mountPath: /opt/airflow/dbt
          - name: dbt-venv
            mountPath: /opt/airflow/dbt_venv
          - name: extra-python-packages
            mountPath: /opt/airflow/extra_python_packages
      - name: copy-dags
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /opt/airflow/dags/utils
            for file in /configmap/*; do
              filename=$(basename "$file")
              if echo "$filename" | grep -q "^utils_"; then
                cp "$file" "/opt/airflow/dags/utils/$(echo $filename | sed 's/^utils_//')"
              else
                cp "$file" "/opt/airflow/dags/$filename"
              fi
            done
        volumeMounts:
          - name: dags-configmap
            mountPath: /configmap
          - name: dags
            mountPath: /opt/airflow/dags
      - name: copy-datahub-recipes
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /opt/airflow/datahub/recipes
            if [ -d /configmap-datahub ]; then
              cp /configmap-datahub/* /opt/airflow/datahub/recipes/ 2>/dev/null || echo "No DataHub recipes found"
              echo "✅ DataHub recipes copied"
            else
              echo "⚠️  DataHub recipes ConfigMap not found"
            fi
        volumeMounts:
          - name: datahub-recipes-configmap
            mountPath: /configmap-datahub
          - name: datahub
            mountPath: /opt/airflow/datahub
  
  # DAG Processor configuration (REQUIRED in Airflow 3)
  dagProcessor:
    enabled: true
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 512Mi
    
    extraVolumes:
      - name: dags-configmap
