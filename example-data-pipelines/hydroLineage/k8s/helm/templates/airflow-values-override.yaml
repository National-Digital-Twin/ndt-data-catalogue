{{- /*
This template overrides specific Airflow values with dynamic release name
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-airflow-config
  namespace: {{ .Release.Namespace }}
data:
  warehouse-host: "{{ .Release.Name }}-warehouse-postgresql"
  metadata-host: "{{ .Release.Name }}-postgresql"
  dags-configmap: "{{ .Release.Name }}-dags"
