apiVersion: batch/v1
kind: Job
metadata:
  name: datahub-cleanup
  namespace: hydro-lineage
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: cleanup
        image: python:3.11-slim
        command:
        - /bin/bash
        - -c
        - |
          pip install requests
          python /scripts/cleanup_datahub_metadata.py
        env:
        - name: DATAHUB_GMS_TOKEN
          valueFrom:
            secretKeyRef:
              name: datahub-gms-token
              key: DATAHUB_GMS_TOKEN
        - name: DATAHUB_GMS_URL
          value: "http://datahub-datahub-gms.datahub.svc.cluster.local:8080"
        volumeMounts:
        - name: script
          mountPath: /scripts
      volumes:
      - name: script
        configMap:
          name: datahub-cleanup-script
