apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-hydro-lineage-to-datahub
  namespace: datahub
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces: ["hydro-lineage"]
    to:
    - operation:
        ports: ["8080"]  # DataHub GMS port
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-hydro-lineage-to-datahub-frontend
  namespace: datahub
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces: ["hydro-lineage"]
    to:
    - operation:
        ports: ["9002"]  # DataHub frontend port
