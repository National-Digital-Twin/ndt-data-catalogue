# Kubernetes Secrets for HydroLineage
# IMPORTANT: This is a template. DO NOT commit actual secrets to git!
# In production, use: kubectl create secret generic <name> --from-literal=key=value

apiVersion: v1
kind: Secret
metadata:
  name: airflow-webserver-secret
  namespace: hydro-lineage
type: Opaque
stringData:
  webserver-secret-key: "CHANGE_ME_RANDOM_STRING_32_CHARS"  # Generate with: openssl rand -hex 32

---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-connections
  namespace: hydro-lineage
type: Opaque
stringData:
  # PostgreSQL connection for Airflow
  AIRFLOW_CONN_HYDRO_POSTGRES: "postgresql://postgres:<set-via-hydro-db-credentials-secret>@hydro-lineage-postgresql:5432/hydro"
  
  # DataHub connection (if using)
  AIRFLOW_CONN_DATAHUB_REST: "http://datahub-gms:8080"

---
