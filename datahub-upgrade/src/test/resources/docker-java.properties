#
# Configures the docker-java client used by Testcontainers.
#
# GitHub Actions ubuntu-latest (Ubuntu 24.04) ships Docker Engine 29.x which requires
# a minimum API version of 1.44. The shaded docker-java bundled inside testcontainers-1.21.x
# defaults to sending unversioned HTTP requests (/info instead of /v1.44/info), which Docker 29
# interprets as API version 1.32, triggering:
#   "client version 1.32 is too old. Minimum supported API version is 1.44"
#
# Setting api.version here forces docker-java to use /v1.44/ in all request URLs, which
# satisfies Docker 29's minimum requirement. This property is read by
# DefaultDockerClientConfig via Class.getResourceAsStream("/docker-java.properties").
api.version=1.44
