run_id: doris-multidb-test

source:
  type: doris
  config:
    username: root
    password: ""
    host_port: localhost:59030
    # No database specified - should ingest from all databases
    database_pattern:
      allow:
        - "^dorisdb"

sink:
  type: file
  config:
    filename: "./doris_mces.json"
