name: Python Build
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/python-build-pages.yml"
      - "metadata-ingestion/**"
      - "datahub-actions/**"
      - "metadata-ingestion-modules/**"
      - "metadata-models/**"
      - "python-build/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/python-build-pages.yml"
      - "metadata-ingestion/**"
      - "datahub-actions/**"
      - "metadata-ingestion-modules/**"
      - "metadata-models/**"
      - "python-build/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_WHEELS_PROJECT_NAME != '' }}

    name: Python Wheels
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    outputs:
      pypi_index_url: ${{ steps.cloudflare.outputs.url }}
      pypi_index_simple_url: ${{ steps.set-pypi-url.outputs.pypi_index_simple_url }}
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "zulu"
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: acryldata/sane-checkout-action@ad9618e2f67a71f3b86218f82bfbb9df12a15aee # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: "pip"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements.txt') }}
      - name: Build Python wheel site
        run: |
          ./gradlew :python-build:buildSite
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish
        id: cloudflare
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_WHEELS_PROJECT_NAME }}
          workingDirectory: python-build
          directory: site
          gitHubToken: ${{ github.token }}

      - name: Set PyPI index URL output
        id: set-pypi-url
        run: |
          PYPI_URL="${{ steps.cloudflare.outputs.url }}/simple"
          echo "pypi_index_simple_url=$PYPI_URL" >> "$GITHUB_OUTPUT"
          echo "PyPI index URL: $PYPI_URL"

          # Save to artifact for consumption by docker-unified.yml
          mkdir -p /tmp/pypi-config
          echo "$PYPI_URL" > /tmp/pypi-config/pypi-index-url.txt
          echo "Base URL: ${{ steps.cloudflare.outputs.url }}" > /tmp/pypi-config/deployment-info.txt
          echo "Simple URL: $PYPI_URL" >> /tmp/pypi-config/deployment-info.txt

      - name: Upload PyPI config artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-config
          path: /tmp/pypi-config/
          retention-days: 1
