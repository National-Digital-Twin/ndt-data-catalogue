[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "license-header-migration"
version = "0.1.0"
description = "Tool to migrate license headers to NDT format"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "OGL-UK-3.0"}
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
migrate-headers = "license_header_migration.migrate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/license_header_migration --cov-report=term-missing"

[tool.setuptools.packages.find]
where = ["src"]
