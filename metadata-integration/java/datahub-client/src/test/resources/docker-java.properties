#
# Forces docker-java (shaded inside testcontainers-1.21.x) to use API version 1.44.
# The shaded DefaultDockerClientConfig reads 'api.version' from this classpath resource.
# Without it, docker-java sends unversioned requests that Docker 29 (GitHub Actions
# ubuntu-latest) rejects: "client version 1.32 is too old. Minimum supported API version is 1.44"
api.version=1.44
